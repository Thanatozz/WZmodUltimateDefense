name: CI Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-default:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create default mod
        run: |
          mkdir -p dist/
          rsync -a mod/ dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          path: dist/

  detect-overlays:
    runs-on: ubuntu-latest
    outputs:
      overlays: ${{ steps.list.outputs.overlays }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List overlays
        id: list
        run: |
          # Produces a JSON array like ["Florence","Chicago"]
          overlays=$(ls -1 overlays/ | jq -R . | jq -sc .)
          echo "overlays=$overlays" >> "$GITHUB_OUTPUT"

  build-overlays:
    needs: detect-overlays
    runs-on: ubuntu-latest
    strategy:
      matrix:
        map: ${{ fromJson(needs.detect-overlays.outputs.overlays) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge default mod + overlay
        run: |
          mkdir -p dist/
          # 1. Start with everything from mod/
          rsync -a mod/ dist/
          # 2. Overlay files
          rsync -a overlays/${{ matrix.map }}/ dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.map }}
          path: dist/
